[package]
name = "visioncortex"
version = "0.9.2"
authors = ["Chris Tsang <tyt2y7@gmail.com>"]
edition = "2021"
description = "Semantic Computer Vision"
license = "MIT OR Apache-2.0"
homepage = "http://www.visioncortex.org/"
repository = "https://github.com/visioncortex/visioncortex/"
categories = ["graphics", "computer-vision"]
keywords = ["computer-graphics", "computer-vision"]
exclude = [
    "docs/*",
    "tests/parity/*",
]

[dependencies]
bit-vec = "0.6"
num-traits = "0.2"
flo_curves = "0.3"

[features]
# Instruments color_clusters stage 2 with operation counters and coarse timers.
# Off by default; enable only for profiling (see examples/profile_stage2.rs).
profile-stage2 = []

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
